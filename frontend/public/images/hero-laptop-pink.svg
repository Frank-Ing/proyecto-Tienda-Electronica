<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Laptop sobre un escritorio con pantalla colorida</title>
  <desc id="desc">Imagen decorativa de una laptop con iluminación coral, rosa y cyan</desc>
  <defs>
